name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inkforge
          POSTGRES_PASSWORD: inkforge
          POSTGRES_DB: inkforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inkforge -d inkforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://inkforge:inkforge@localhost:5432/inkforge
      INTEGRATION_ADMIN_URL: postgres://inkforge:inkforge@localhost:5432/inkforge
      INKFORGE_PG_TEST: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:libs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:stubs -- --strict
      - run: npm run audit:dod -- --strict
      - run: npm run build

  e2e:
    needs: gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inkforge
          POSTGRES_PASSWORD: inkforge
          POSTGRES_DB: inkforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inkforge -d inkforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://inkforge:inkforge@localhost:5432/inkforge
      INTEGRATION_ADMIN_URL: postgres://inkforge:inkforge@localhost:5432/inkforge
      INKFORGE_PG_TEST: "1"
      WEB_PORT: "3100"
      FORGE_BASE_URL: http://localhost:4000
      FORGE_SHARED_SECRET: e2e-bridge-secret
      FORGE_PRINCIPAL: preview-user
      KEY_ENCRYPTION_SECRET: e2e-key-encryption
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:libs
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
